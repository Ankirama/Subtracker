# Subscription Tracker — NAS / Dockhand deployment (no Traefik, behind a reverse proxy)
#
# Unlike a Traefik-based server setup:
#   - No Traefik: the frontend nginx is reconfigured (inline `configs` below) to also
#     proxy /api -> backend, so a single container serves the whole app.
#   - The frontend is NOT published on the LAN. It joins the external `proxy` network so a
#     reverse proxy on the same NAS (e.g. Nginx Proxy Manager) reaches it by container name
#     (subtracker_frontend:80) and terminates TLS. Create the network first:
#       docker network create proxy      (or via Dockhand -> Networks)
#   - A one-shot `migrate` service runs `alembic upgrade head` before the backend starts.
#
# Prefer a published LAN port instead of a reverse proxy? Add to the frontend service:
#       ports: ["${FRONTEND_PORT:-8080}:80"]
# and you can drop the `proxy` network.
#
# Images are pulled from GHCR (built by .github/workflows/cd.yml on every push to main).
# All variables come from the stack Environment tab in Dockhand (written to `.env`).
# See docs/operations/deploy-nas-dockhand.md for the full walkthrough.
#
# Requires Docker Compose v2.23.1+ for inline `configs.content`. If your Docker is older,
# see the fallback in the deploy doc (bind-mount a nginx.nas.conf file instead).

name: subtracker

configs:
  frontend_nginx:
    content: |
      server {
          listen 80;
          server_name _;
          root /usr/share/nginx/html;
          index index.html;

          gzip on;
          gzip_vary on;
          gzip_min_length 1024;
          gzip_types text/plain text/css application/javascript application/json image/svg+xml;

          # Security headers (mirrors the image default)
          add_header X-Frame-Options "SAMEORIGIN" always;
          add_header X-Content-Type-Options "nosniff" always;
          add_header Referrer-Policy "strict-origin-when-cross-origin" always;

          # Proxy API calls to the backend. The SPA calls /api relatively in production,
          # so this keeps everything same-origin on the single published port.
          # NOTE: nginx runtime variables are written as $$ so Docker Compose passes a
          # literal $ to nginx instead of trying to interpolate them.
          location /api/ {
              proxy_pass http://backend:8000;
              proxy_set_header Host $$host;
              proxy_set_header X-Real-IP $$remote_addr;
              proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $$scheme;
              proxy_http_version 1.1;
              proxy_set_header Upgrade $$http_upgrade;
              proxy_set_header Connection "upgrade";
              proxy_read_timeout 300s;
          }

          # FastAPI interactive docs (optional, handy for debugging)
          location ~ ^/(docs|redoc|openapi\.json)$$ {
              proxy_pass http://backend:8000;
              proxy_set_header Host $$host;
              proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $$scheme;
          }

          # SPA routing — serve index.html for client-side routes
          location / {
              try_files $$uri $$uri/ /index.html;
          }
      }

  # Discord notification hook for the pg_backup sidecar (mounted into /hooks).
  # postgres-backup-local runs it via run-parts with the situation as $1
  # (pre-backup | post-backup | error). Shell vars are written $$ so Compose
  # passes a literal $ through to the container file.
  pg_backup_notify:
    content: |
      #!/bin/sh
      [ -z "$$DISCORD_WEBHOOK_URL" ] && exit 0
      situation="$$1"
      shift
      details=$$(printf '%s' "$$*" | tr -d '"\\%' | tr '\n\r' '  ' | cut -c1-400)
      case "$$situation" in
        post-backup)
          color=3066993
          title="✅ Backup OK — $$POSTGRES_DB"
          [ -z "$$details" ] && details="New dump stored in /backups"
          ;;
        error)
          color=15158332
          title="❌ Backup FAILED — $$POSTGRES_DB"
          [ -z "$$details" ] && details="See subtracker_pg_backup logs"
          ;;
        *)
          exit 0
          ;;
      esac
      payload=$$(printf '{"embeds":[{"title":"[subtracker] %s","description":"%s","color":%s}]}' "$$title" "$$details" "$$color")
      curl -sf -m 10 -H "Content-Type: application/json" -X POST -d "$$payload" "$$DISCORD_WEBHOOK_URL" >/dev/null 2>&1 || true

services:
  postgres:
    image: postgres:15-alpine
    container_name: subtracker_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: subtracker_redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]
    restart: unless-stopped

  # Automatic PostgreSQL backups: scheduled logical pg_dump with retention.
  # A logical dump is transaction-consistent; copying the live postgres_data volume is not.
  # Dumps land (gzipped) in the postgres_backups volume under last/daily/weekly/monthly.
  pg_backup:
    image: prodrigestivill/postgres-backup-local:15
    container_name: subtracker_pg_backup
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SCHEDULE: ${BACKUP_SCHEDULE:-@daily}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-7}
      BACKUP_KEEP_WEEKS: ${BACKUP_KEEP_WEEKS:-4}
      BACKUP_KEEP_MONTHS: ${BACKUP_KEEP_MONTHS:-6}
      # --clean --if-exists makes each dump self-contained (drops+recreates on restore)
      POSTGRES_EXTRA_OPTS: "--clean --if-exists"
      # Set to a Discord webhook URL to get success/failure notifications (optional).
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
    volumes:
      - postgres_backups:/backups
    configs:
      - source: pg_backup_notify
        target: /hooks/discord-notify
        mode: 0555
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]
    restart: unless-stopped

  # One-shot: apply DB migrations, then exit. Backend waits for this to complete.
  migrate:
    image: ghcr.io/${GITHUB_REPOSITORY:-ankirama/subtracker}-backend:${IMAGE_TAG:-latest}
    container_name: subtracker_migrate
    command: alembic upgrade head
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]
    restart: "no"

  backend:
    image: ghcr.io/${GITHUB_REPOSITORY:-ankirama/subtracker}-backend:${IMAGE_TAG:-latest}
    container_name: subtracker_backend
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    volumes:
      - logos_data:/app/logos
      - ./backups:/app/backups
      - backend_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks: [internal]
    restart: unless-stopped

  celery_worker:
    image: ghcr.io/${GITHUB_REPOSITORY:-ankirama/subtracker}-backend:${IMAGE_TAG:-latest}
    container_name: subtracker_celery
    command: celery -A app.celery_app worker --loglevel=warning --concurrency=2
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    volumes:
      - backend_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks: [internal]
    restart: unless-stopped

  celery_beat:
    image: ghcr.io/${GITHUB_REPOSITORY:-ankirama/subtracker}-backend:${IMAGE_TAG:-latest}
    container_name: subtracker_celery_beat
    command: celery -A app.celery_app beat --loglevel=warning
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks: [internal]
    restart: unless-stopped

  frontend:
    image: ghcr.io/${GITHUB_REPOSITORY:-ankirama/subtracker}-frontend:${IMAGE_TAG:-latest}
    container_name: subtracker_frontend
    configs:
      - source: frontend_nginx
        target: /etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    # `internal` to reach the backend; `proxy` so the reverse proxy (NPM) can reach this
    # container by name. No published port — TLS/exposure is handled by the reverse proxy.
    networks: [internal, proxy]
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  logos_data:
  backend_logs:
  postgres_backups:

networks:
  internal:
    driver: bridge
  # Shared with the reverse proxy (Nginx Proxy Manager). Create it once before deploying:
  #   docker network create proxy
  proxy:
    external: true
