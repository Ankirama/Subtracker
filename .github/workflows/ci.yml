name: CI - Quality & Security Checks

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

jobs:
  # Backend Python checks
  backend-quality:
    name: Backend Quality & Security
    runs-on: ubuntu-latest
    environment: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pip-audit

      - name: Lint with Black
        working-directory: backend
        run: black --check .

      - name: Lint with Ruff
        working-directory: backend
        run: ruff check .

      - name: Type checking with mypy
        working-directory: backend
        run: |
          mypy app --ignore-missing-imports --no-strict-optional --disable-error-code=assignment --disable-error-code=arg-type --disable-error-code=union-attr --disable-error-code=var-annotated || true

      # Strix disabled - run manually due to long execution time (LLM-powered analysis)
      # To run manually: pipx install strix-agent && strix -n -t .
      # - name: Security scan with Strix
      #   working-directory: backend
      #   env:
      #     STRIX_LLM: ${{ secrets.STRIX_LLM }}
      #     LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      #   run: |
      #     pipx install strix-agent
      #     strix -n -t . || true

      - name: Dependency vulnerability scan
        working-directory: backend
        run: |
          pip-audit --desc --format json --output pip-audit.json || true
          if [ -f pip-audit.json ]; then
            cat pip-audit.json
          fi

      - name: Create logs directory
        run: sudo mkdir -p /app/logs && sudo chmod 777 /app/logs

      - name: Run tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test_db
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: test@example.com
          RESEND_FROM_NAME: Test
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          REDIS_URL: redis://localhost:6379/0
          CELERY_BROKER_URL: redis://localhost:6379/0
          CELERY_RESULT_BACKEND: redis://localhost:6379/0
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: |
          pytest tests/ -v --cov=app --cov-report=term-missing --cov-report=xml

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          file: ./backend/coverage.xml
          flags: backend
          fail_ci_if_error: false

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

  # Frontend checks
  frontend-quality:
    name: Frontend Quality & Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint with ESLint
        working-directory: frontend
        run: npm run lint

      - name: Type checking with TypeScript
        working-directory: frontend
        run: npx tsc --noEmit --strict

      - name: Run tests
        working-directory: frontend
        run: npm test -- --run

      - name: Build check
        working-directory: frontend
        run: npm run build

      - name: Dependency vulnerability scan
        working-directory: frontend
        run: |
          npm audit --json > npm-audit.json || true
          cat npm-audit.json

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist
          retention-days: 7

  # Database migration validation
  migration-validation:
    name: Database Migration Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Alembic migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test_db
        run: |
          # Check for migration conflicts
          alembic branches

          # Validate migration can be applied
          alembic upgrade head

          # Check for pending migrations
          alembic current

      - name: Validate migration downgrade
        working-directory: backend
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test_db
        run: |
          # Test downgrade works
          alembic downgrade -1
          alembic upgrade head

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

  # Secrets detection
  secrets-scan:
    name: Secrets Detection
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for comprehensive scanning

      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  # Security summary
  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [backend-quality, frontend-quality, secrets-scan]
    if: always()

    steps:
      - name: Security check status
        run: |
          echo "🔒 Security Checks Complete"
          echo "Backend Quality: ${{ needs.backend-quality.result }}"
          echo "Frontend Quality: ${{ needs.frontend-quality.result }}"
          echo "Secrets Scan: ${{ needs.secrets-scan.result }}"

          if [ "${{ needs.backend-quality.result }}" != "success" ] || \
             [ "${{ needs.frontend-quality.result }}" != "success" ] || \
             [ "${{ needs.secrets-scan.result }}" != "success" ]; then
            echo "❌ Some security checks failed"
            exit 1
          fi

          echo "✅ All security checks passed"
