name: CD - Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:  # Allow manual deployment

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Build and push Docker images
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: []  # Can add CI workflow as dependency if needed
    permissions:
      contents: read
      packages: write

    outputs:
      backend_tag: ${{ steps.meta-backend.outputs.tags }}
      frontend_tag: ${{ steps.meta-frontend.outputs.tags }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Backend image
      - name: Extract metadata for backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:buildcache,mode=max

      # Frontend image
      - name: Extract metadata for frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:buildcache,mode=max

  # Deploy to production server
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: production
      url: https://subscriptionstracker.io

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to production
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/deploy_key $SSH_USER@$SSH_HOST << 'ENDSSH'
            set -e

            echo "📦 Deploying to production..."
            cd ${{ secrets.DEPLOY_PATH }}

            # Create backup of current state
            echo "💾 Creating backup..."
            BACKUP_DIR="backups/$(date +%Y%m%d_%H%M%S)"
            mkdir -p "$BACKUP_DIR"
            docker-compose config > "$BACKUP_DIR/docker-compose-backup.yml" || true

            # Pull latest code
            echo "⬇️ Pulling latest code..."
            git fetch origin
            git reset --hard origin/main

            # Login to GitHub Container Registry
            echo "🔐 Logging into GitHub Container Registry..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pull latest images
            echo "📥 Pulling latest Docker images..."
            docker-compose pull

            # Stop services
            echo "🛑 Stopping services..."
            docker-compose down

            # Start services with new images
            echo "🚀 Starting services..."
            docker-compose up -d

            # Wait for services to be ready
            echo "⏳ Waiting for services to start..."
            sleep 10

            # Run database migrations
            echo "🔄 Running database migrations..."
            docker-compose exec -T backend alembic upgrade head

            # Health check
            echo "🏥 Running health checks..."
            sleep 5

            # Check backend health
            BACKEND_STATUS=$(docker-compose exec -T backend curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/health || echo "000")
            if [ "$BACKEND_STATUS" != "200" ]; then
              echo "❌ Backend health check failed (status: $BACKEND_STATUS)"
              echo "📋 Backend logs:"
              docker-compose logs --tail=50 backend
              exit 1
            fi

            echo "✅ Backend is healthy"

            # Check services are running
            if ! docker-compose ps | grep -q "Up"; then
              echo "❌ Some services are not running"
              docker-compose ps
              exit 1
            fi

            echo "✅ Deployment successful!"

            # Cleanup old images
            echo "🧹 Cleaning up old Docker images..."
            docker image prune -f --filter "until=168h"

          ENDSSH

      - name: Deployment notification
        if: always()
        run: |
          if [ ${{ job.status }} == 'success' ]; then
            echo "✅ Deployment to production completed successfully"
          else
            echo "❌ Deployment to production failed"
            exit 1
          fi

      - name: Rollback on failure
        if: failure()
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/deploy_key $SSH_USER@$SSH_HOST << 'ENDSSH'
            set -e

            echo "⚠️ Deployment failed, attempting rollback..."
            cd ${{ secrets.DEPLOY_PATH }}

            # Find latest backup
            LATEST_BACKUP=$(ls -t backups/ | head -1)

            if [ -n "$LATEST_BACKUP" ]; then
              echo "🔄 Rolling back to $LATEST_BACKUP..."

              # Restore docker-compose config if exists
              if [ -f "backups/$LATEST_BACKUP/docker-compose-backup.yml" ]; then
                cp "backups/$LATEST_BACKUP/docker-compose-backup.yml" docker-compose.yml
              fi

              # Restart with previous configuration
              docker-compose down
              docker-compose up -d

              echo "✅ Rollback completed"
            else
              echo "⚠️ No backup found for rollback"
            fi

          ENDSSH

  # Post-deployment health checks
  health-check:
    name: Post-Deployment Health Check
    runs-on: ubuntu-latest
    needs: deploy
    if: success()

    steps:
      - name: Check production health
        run: |
          echo "🏥 Checking production health..."

          # Check main domain
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://subscriptionstracker.io)

          if [ "$STATUS" == "200" ]; then
            echo "✅ Production is healthy (status: $STATUS)"
          else
            echo "⚠️ Production returned status: $STATUS"
            exit 1
          fi

      - name: Check API health
        run: |
          echo "🔍 Checking API health..."

          # Check backend API
          API_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://subscriptionstracker.io/api/health)

          if [ "$API_STATUS" == "200" ]; then
            echo "✅ API is healthy (status: $API_STATUS)"
          else
            echo "⚠️ API returned status: $API_STATUS"
            exit 1
          fi
