version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: subtracker_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal
    restart: always

  # Redis
  redis:
    image: redis:7-alpine
    container_name: subtracker_redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal
    restart: always

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: subtracker_backend
    env_file:
      - .env.production
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    volumes:
      - logos_data:/app/logos
      - ./backups:/app/backups
      - backend_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - proxy
      - internal
    labels:
      - traefik.enable=true
      # API Router - handles /api/* requests
      - traefik.http.routers.subtracker-api.rule=Host(`${SUBDOMAIN}.${DOMAIN_NAME}`) && PathPrefix(`/api`)
      - traefik.http.routers.subtracker-api.tls=true
      - traefik.http.routers.subtracker-api.entrypoints=web,websecure
      - traefik.http.routers.subtracker-api.tls.certresolver=mytlschallenge
      - traefik.http.routers.subtracker-api.service=subtracker-api-svc
      - traefik.http.services.subtracker-api-svc.loadbalancer.server.port=8000
      # Health check endpoint
      - traefik.http.routers.subtracker-health.rule=Host(`${SUBDOMAIN}.${DOMAIN_NAME}`) && Path(`/health`)
      - traefik.http.routers.subtracker-health.tls=true
      - traefik.http.routers.subtracker-health.entrypoints=web,websecure
      - traefik.http.routers.subtracker-health.tls.certresolver=mytlschallenge
      - traefik.http.routers.subtracker-health.service=subtracker-api-svc
      # Docs endpoint
      - traefik.http.routers.subtracker-docs.rule=Host(`${SUBDOMAIN}.${DOMAIN_NAME}`) && (Path(`/docs`) || Path(`/redoc`) || PathPrefix(`/openapi`))
      - traefik.http.routers.subtracker-docs.tls=true
      - traefik.http.routers.subtracker-docs.entrypoints=web,websecure
      - traefik.http.routers.subtracker-docs.tls.certresolver=mytlschallenge
      - traefik.http.routers.subtracker-docs.service=subtracker-api-svc
      # Security headers middleware
      - traefik.http.middlewares.subtracker-headers.headers.SSLRedirect=true
      - traefik.http.middlewares.subtracker-headers.headers.STSSeconds=315360000
      - traefik.http.middlewares.subtracker-headers.headers.browserXSSFilter=true
      - traefik.http.middlewares.subtracker-headers.headers.contentTypeNosniff=true
      - traefik.http.middlewares.subtracker-headers.headers.forceSTSHeader=true
      - traefik.http.middlewares.subtracker-headers.headers.STSIncludeSubdomains=true
      - traefik.http.middlewares.subtracker-headers.headers.STSPreload=true
      - traefik.http.routers.subtracker-api.middlewares=subtracker-headers@docker
      - traefik.docker.network=proxy
    restart: always

  # Celery Worker
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: subtracker_celery
    command: celery -A app.celery_app worker --loglevel=warning --concurrency=2
    env_file:
      - .env.production
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    volumes:
      - backend_logs:/app/logs
    depends_on:
      - postgres
      - redis
    networks:
      - internal
    restart: always

  # Celery Beat (Scheduler)
  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: subtracker_celery_beat
    command: celery -A app.celery_app beat --loglevel=warning
    env_file:
      - .env.production
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      - postgres
      - redis
    networks:
      - internal
    restart: always

  # Frontend (React app served by nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: https://${SUBDOMAIN}.${DOMAIN_NAME}/api
    container_name: subtracker_frontend
    networks:
      - proxy
    labels:
      - traefik.enable=true
      # Frontend Router - handles all other requests
      - traefik.http.routers.subtracker-frontend.rule=Host(`${SUBDOMAIN}.${DOMAIN_NAME}`)
      - traefik.http.routers.subtracker-frontend.tls=true
      - traefik.http.routers.subtracker-frontend.entrypoints=web,websecure
      - traefik.http.routers.subtracker-frontend.tls.certresolver=mytlschallenge
      - traefik.http.routers.subtracker-frontend.service=subtracker-frontend-svc
      - traefik.http.services.subtracker-frontend-svc.loadbalancer.server.port=80
      # Lower priority than API routes
      - traefik.http.routers.subtracker-frontend.priority=1
      - traefik.http.routers.subtracker-api.priority=2
      - traefik.http.routers.subtracker-health.priority=2
      - traefik.http.routers.subtracker-docs.priority=2
      # Security headers
      - traefik.http.routers.subtracker-frontend.middlewares=subtracker-headers@docker
      - traefik.docker.network=proxy
    restart: always

volumes:
  postgres_data:
  redis_data:
  logos_data:
  backend_logs:

networks:
  # External network shared with Traefik
  proxy:
    external: true
  # Internal network for backend services
  internal:
    driver: bridge
